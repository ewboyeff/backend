version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: charity_index_db
    restart: always
    environment:
      POSTGRES_DB: charity_index
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d charity_index"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: .
    container_name: charity_index_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/charity_index
      SECRET_KEY: ${SECRET_KEY:-charity_index_super_secret_jwt_key_2026}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["*"]}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  uploads_data:
